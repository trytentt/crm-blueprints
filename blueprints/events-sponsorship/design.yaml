extends: core
name: Events and sponsorship
description: >-
  An event organiser that earns revenue from sponsors and exhibitors. Sponsor and exhibitor sales run
  as two deal pipelines, each tied to an event. Packages and stand space are the inventory. Each won
  deal gets a fulfilment record so that what was promised is delivered and the renewal is prepared.

add_objects:
  - key: event
    label: Event
    plural_label: Events
    description: >-
      One edition of an event, with its dates, venue and revenue targets. Every sponsor and exhibitor
      deal links to an event, so sales can be reported per edition and compared year on year.
  - key: package
    label: Package
    plural_label: Packages
    description: >-
      One thing the organiser sells for an event, such as a sponsorship tier, a block of stand space
      or an add-on. Holds price and quantity so availability and sell-through can be seen.
  - key: fulfilment
    label: Fulfilment
    plural_label: Fulfilments
    description: >-
      The work of delivering what one sponsor or exhibitor bought, such as logo, speaking slot, stand
      allocation and passes. Owned by the partnerships or operations team, separate from the sales deal.

add_fields:
  # Company
  - object: company
    key: account_type
    label: Account type
    type: select
    description: What kind of organisation this is. Used to target the right packages.
    options:
      brand_sponsor: Brand or sponsor
      solution_provider: Solution provider
      agency: Agency
      association: Association
      media_partner: Media partner
      venue_or_supplier: Venue or supplier
  - object: company
    key: participation_status
    label: Participation status
    type: select
    description: Whether and when the company has taken part. Drives renewal and win-back lists.
    options:
      target: Target
      current: Current this edition
      past: Past participant
      lapsed: Lapsed
  - object: company
    key: lead_source
    label: Lead source
    type: select
    description: How the company first came to us. Set once, never overwritten.
    options:
      outbound: Outbound
      inbound_enquiry: Inbound enquiry
      previous_edition: Previous edition
      referral: Referral
      attendee_conversion: Attendee conversion
      agency: Agency
  # Person
  - object: person
    key: buying_role
    label: Buying role
    type: select
    description: The part this person plays in a sponsorship or stand purchase. Used to check the right people are engaged.
    options:
      marketing_lead: Marketing lead
      sales_lead: Sales lead
      event_manager: Event manager
      signatory: Contract signatory
      booth_contact: Day-to-day stand contact
      procurement: Procurement
  # Deal
  - object: deal
    key: lost_reason
    label: Lost reason
    type: select
    description: Why the deal was lost. Required on every lost stage.
    options:
      no_budget: No budget
      not_right_audience: Audience not right
      price: Price
      chose_other_event: Chose another event
      category_taken: Category exclusivity taken
      internal_priority_change: Internal priority change
      no_response: No response
      other: Other
  - object: deal
    key: next_step_date
    label: Next step date
    type: date
    description: When the next step is due. Open deals with no future date are stalled.
  - object: deal
    key: sponsor_tier
    label: Sponsor tier
    type: select
    description: The sponsorship level being sold. Used to report revenue and sell-through per tier.
    options: {headline: Headline, gold: Gold, silver: Silver, bronze: Bronze, bespoke: Bespoke}
  - object: deal
    key: sponsor_objectives
    label: Sponsor objectives
    type: multi_select
    description: What the sponsor wants from the event. The proposal and the wrap-up report are built around these.
    options:
      lead_generation: Lead generation
      brand_awareness: Brand awareness
      thought_leadership: Thought leadership
      product_launch: Product launch
      hiring: Hiring
      customer_hospitality: Customer hospitality
  - object: deal
    key: stand_size_sqm
    label: Stand size (sqm)
    type: number
    description: Floor area requested or booked for an exhibitor.
  - object: deal
    key: stand_type
    label: Stand type
    type: select
    description: The kind of stand being sold. Sets price and build requirements.
    options:
      shell_scheme: Shell scheme
      space_only: Space only
      premium_corner: Premium corner
      tabletop: Tabletop
  - object: deal
    key: prior_participant
    label: Prior participant
    type: checkbox
    description: The company sponsored or exhibited at an earlier edition. Used to report renewal rate.
  - object: deal
    key: deposit_received
    label: Deposit received
    type: checkbox
    description: The booking deposit has been paid. Space is not confirmed without it.
  - object: deal
    key: payment_terms
    label: Payment terms
    type: select
    description: When the balance is due. Finance uses it to chase.
    options: {on_signature: On signature, deposit_and_balance: Deposit then balance, instalments: Instalments, invoice_30_days: "Invoice, 30 days"}
  - object: deal
    key: contract_signed_date
    label: Contract signed date
    type: date
    description: The day the signed contract or booking form was received.
  # Event
  - object: event
    key: name
    label: Name
    type: text
    description: Event name and year, for example Annual summit 2027.
    required: true
  - object: event
    key: status
    label: Status
    type: select
    description: Where the event is in its cycle. Drives which sales and fulfilment views apply.
    options:
      planning: Planning
      on_sale: On sale
      sold_out: Sold out
      live: Live
      completed: Completed
      cancelled: Cancelled
  - object: event
    key: event_type
    label: Event type
    type: select
    description: The format of the event, for reporting across the portfolio.
    options: {conference: Conference, trade_show: Trade show, summit: Summit, awards: Awards, hybrid: Hybrid}
  - object: event
    key: start_date
    label: Start date
    type: date
    description: First day of the event.
  - object: event
    key: end_date
    label: End date
    type: date
    description: Last day of the event.
  - object: event
    key: venue
    label: Venue
    type: text
    description: Venue name and city. Used for stand plans and logistics.
  - object: event
    key: expected_attendees
    label: Expected attendees
    type: number
    description: Forecast attendance, used in sponsor and exhibitor proposals.
  - object: event
    key: sponsorship_target
    label: Sponsorship target
    type: currency
    description: Revenue target for sponsorship. Compared with signed deals.
  - object: event
    key: exhibition_target
    label: Exhibition target
    type: currency
    description: Revenue target for stand sales. Compared with signed deals.
  - object: event
    key: total_stand_sqm
    label: Total stand space (sqm)
    type: number
    description: Sellable floor area. Used to show how much space is left.
  - object: event
    key: event_lead
    label: Event lead
    type: user
    description: The team member accountable for the event.
  # Package
  - object: package
    key: name
    label: Name
    type: text
    description: The package as sold, for example gold sponsor or 9 sqm shell scheme.
    required: true
  - object: package
    key: package_type
    label: Package type
    type: select
    description: What kind of inventory this is.
    options: {sponsor_tier: Sponsor tier, stand_space: Stand space, add_on: Add-on}
  - object: package
    key: price
    label: Price
    type: currency
    description: Price excluding VAT.
  - object: package
    key: quantity_available
    label: Quantity available
    type: number
    description: How many of this package exist in total.
  - object: package
    key: quantity_sold
    label: Quantity sold
    type: number
    description: How many are sold. Maintained by an automation from won deals.
  - object: package
    key: exclusive
    label: Category exclusive
    type: checkbox
    description: Only one company per category can buy this. Checked before a proposal is sent.
  # Fulfilment
  - object: fulfilment
    key: name
    label: Name
    type: text
    description: Company name and event, for example the sponsor and Annual summit 2027.
    required: true
  - object: fulfilment
    key: status
    label: Status
    type: select
    description: Where delivery of the booking stands.
    options:
      not_started: Not started
      assets_requested: Assets requested
      in_progress: In progress
      ready: Ready for event
      delivered: Delivered
      wrapped_up: Wrap-up sent
  - object: fulfilment
    key: assets_due_date
    label: Assets due date
    type: date
    description: The day logos, artwork and copy must be received to hit print and web deadlines.
  - object: fulfilment
    key: assets_received
    label: Assets received
    type: checkbox
    description: Logo, copy and artwork have been received from the partner.
  - object: fulfilment
    key: passes_allocated
    label: Passes allocated
    type: number
    description: Number of delegate or exhibitor passes issued with this booking.
  - object: fulfilment
    key: stand_number
    label: Stand number
    type: text
    description: Stand location on the floor plan. Empty for sponsor-only bookings.
  - object: fulfilment
    key: delivery_owner
    label: Delivery owner
    type: user
    description: The team member responsible for delivering the booking.
  - object: fulfilment
    key: renewal_intent
    label: Renewal intent
    type: select
    description: The partner's stated wish for the next edition, captured at the wrap-up meeting.
    options: {will_renew: Will renew, undecided: Undecided, wont_renew: Won't renew, unknown: Unknown}

add_relationships:
  - key: deal_event
    from: deal
    to: event
    cardinality: many_to_one
    from_label: Event
    to_label: Deals
    purpose: Shows all sponsor and exhibitor deals for an edition.
  - key: deal_package
    from: deal
    to: package
    cardinality: many_to_many
    from_label: Packages
    to_label: Deals
    purpose: Records which packages and add-ons a deal includes.
  - key: package_event
    from: package
    to: event
    cardinality: many_to_one
    from_label: Event
    to_label: Packages
    purpose: Lists the inventory for each edition and its sell-through.
  - key: fulfilment_deal
    from: fulfilment
    to: deal
    cardinality: one_to_one
    from_label: Deal
    to_label: Fulfilment
    purpose: Ties delivery to the signed deal so promises made in sales are visible to the delivery team.
  - key: fulfilment_event
    from: fulfilment
    to: event
    cardinality: many_to_one
    from_label: Event
    to_label: Fulfilments
    purpose: Gives the event lead one list of everything to deliver.
  - key: fulfilment_company
    from: fulfilment
    to: company
    cardinality: many_to_one
    from_label: Partner
    to_label: Fulfilments
    purpose: Shows a company's delivery history across editions.

pipelines:
  - object: deal
    key: sponsor_sales
    name: Sponsor sales
    stages:
      - key: prospect
        label: Prospect
        type: open
        probability: 5
        exit_criteria: Entered when a target company and a named marketing contact have been identified for an event.
        required_fields: [sponsor_objectives]
      - key: meeting_held
        label: Meeting held
        type: open
        probability: 20
        exit_criteria: Entered when a discovery call has happened and the sponsor's goals are written down.
        required_fields: [sponsor_objectives, next_step_date]
      - key: proposal_sent
        label: Proposal sent
        type: open
        probability: 40
        exit_criteria: Entered when a proposal tied to the sponsor's goals, with tier and price, has been sent.
        required_fields: [sponsor_tier, amount]
      - key: negotiating
        label: Negotiating
        type: open
        probability: 65
        exit_criteria: Entered when the sponsor has asked for changes to the package, price or terms.
        required_fields: [amount, payment_terms, next_step_date]
      - key: contract_out
        label: Contract out
        type: open
        probability: 85
        exit_criteria: Entered when final terms are agreed and the contract has been sent for signature.
        required_fields: [amount, close_date, payment_terms]
      - key: signed
        label: Signed
        type: won
        probability: 100
        exit_criteria: Entered when the signed contract is received and a fulfilment record is created.
        required_fields: [amount, contract_signed_date, sponsor_tier]
      - key: closed_lost
        label: Closed lost
        type: lost
        probability: 0
        exit_criteria: Entered when the sponsor says no, or has not replied after three follow-ups over 30 days.
        required_fields: [lost_reason]
  - object: deal
    key: exhibitor_sales
    name: Exhibitor sales
    stages:
      - key: enquiry
        label: Enquiry
        type: open
        probability: 10
        exit_criteria: Entered when a company has asked about a stand or been contacted and replied.
        required_fields: [stand_type]
      - key: qualified
        label: Qualified
        type: open
        probability: 30
        exit_criteria: Entered when the exhibitor's goals and space needs have been discussed.
        required_fields: [stand_size_sqm, next_step_date]
      - key: space_held
        label: Space held
        type: open
        probability: 55
        exit_criteria: Entered when a specific stand has been offered with a price and held for a stated number of days.
        required_fields: [stand_size_sqm, amount, next_step_date]
      - key: contract_sent
        label: Contract sent
        type: open
        probability: 80
        exit_criteria: Entered when the booking form and terms have been sent for signature.
        required_fields: [amount, payment_terms, close_date]
      - key: confirmed
        label: Confirmed
        type: won
        probability: 100
        exit_criteria: Entered when the signed booking form and deposit are received and a fulfilment record is created.
        required_fields: [amount, stand_size_sqm, contract_signed_date, deposit_received]
      - key: closed_lost
        label: Closed lost
        type: lost
        probability: 0
        exit_criteria: Entered when the company declines, or the held space is released with no booking.
        required_fields: [lost_reason]

decisions:
  - key: delivery_on_fulfilment_object
    question: Is delivery tracked on a fulfilment object rather than as stages on the deal?
    recommended_default: >-
      Yes. Both deal pipelines end at signed or confirmed. A fulfilment record carries assets, passes,
      stand number and the wrap-up, owned by operations, so the promises made in sales are not lost.
  - key: two_pipelines_one_object
    question: Are sponsor and exhibitor sales two pipelines on Deal or two objects?
    recommended_default: >-
      Two pipelines on Deal. They have different stages and buyers, but finance wants one revenue
      report per event. A company that does both has two deals.
  - key: event_edition_model
    question: Is each edition of a recurring event its own event record?
    recommended_default: >-
      Yes. One event record per edition, so targets, inventory and renewal rate are per year.
      A parent series object is added only if several events share sponsors.
  - key: renewal_as_new_deal
    question: How does a returning sponsor or exhibitor for the next edition get tracked?
    recommended_default: >-
      As a new deal on the next event's record with prior participant ticked. It starts at the
      first open stage, and the wrap-up renewal intent decides who is contacted first.
  - key: custom_objects_plan
    question: Does the client's CRM plan allow the three custom objects?
    recommended_default: >-
      Check before the build. If not, hold event as a company-level text field on the deal, package
      as a deal product list, and fulfilment as a task checklist on the deal. Record the gap in client notes.
  - key: category_exclusivity
    question: Are any packages sold with category exclusivity?
    recommended_default: >-
      Mark them exclusive on the package. Before a proposal is sent the salesperson checks no
      competitor holds that category. The CRM does not enforce this automatically.

automations:
  - key: create_fulfilment_on_win
    name: Create fulfilment on win
    trigger: A sponsor deal moves to signed, or an exhibitor deal moves to confirmed.
    action: >-
      Create a fulfilment record linked to the deal, event and company, set status to not started,
      and assign it to the operations team with the sponsor objectives copied into the notes.
  - key: update_package_sales
    name: Update package sales
    trigger: A deal is won or reopened.
    action: Recalculate quantity sold on each linked package from won deals and flag any package that is sold out.
  - key: request_assets
    name: Request assets
    trigger: A fulfilment is 60 days before its assets due date and assets received is empty.
    action: Email the partner contact an asset request and set the fulfilment status to assets requested.
  - key: start_next_edition_renewals
    name: Start next edition renewals
    trigger: An event is marked completed.
    action: >-
      For each fulfilment with renewal intent will renew or undecided, create a deal on the next
      edition's event with prior participant ticked, and set the company status to past participant.
  - key: flag_stalled_deals
    name: Flag stalled deals
    trigger: An open deal has no next step date, or the date is more than 7 days past.
    action: Notify the deal owner and add the deal to the stalled deals view.

views:
  - key: my_open_deals
    name: My open deals
    object: deal
    filter: Owner is me and stage is open.
    sort: Close date, soonest first.
  - key: stalled_deals
    name: Stalled deals
    object: deal
    filter: Stage is open and next step date is empty or in the past.
    sort: Next step date, oldest first.
  - key: held_space_expiring
    name: Held space
    object: deal
    filter: Stage is space held in the exhibitor sales pipeline.
    sort: Next step date, oldest first.
  - key: package_availability
    name: Package availability
    object: package
    filter: Quantity sold is below quantity available.
    sort: Package type, then price, highest first.
  - key: fulfilment_overdue
    name: Assets overdue
    object: fulfilment
    filter: Assets received is empty and assets due date is in the past.
    sort: Assets due date, oldest first.
  - key: lapsed_partners
    name: Lapsed partners
    object: company
    filter: Participation status is lapsed or past.
    sort: Name, A to Z.

platform_overrides:
  attio:
    objects:
      event: {api_slug: events}
      package: {api_slug: packages}
      fulfilment: {api_slug: fulfilments}
  hubspot:
    fields:
      deal.lost_reason: {property_group: dealinformation}
  salesforce:
    objects:
      event: {api_name: Event__c}
      package: {api_name: Package__c}
      fulfilment: {api_name: Fulfilment__c}
