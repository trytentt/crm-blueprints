[project]
name = "crm-blueprints"
version = "0.1.0"
description = "CRM blueprints and build tooling for Attio, HubSpot and Salesforce."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: talks to a real CRM sandbox; skipped unless credentials are set",
]
