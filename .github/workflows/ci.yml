name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Validate every blueprint
        run: uv run python -m tools.validate --all --strict
      - name: Generated output is up to date
        run: uv run python -m tools.generate --all --check
      - name: Tests
        run: uv run pytest
